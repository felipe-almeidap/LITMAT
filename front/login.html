<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LITMAT-CURSOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-container">
        <h2>Acesso do Aluno</h2>

      
    <form class="login-form" id="loginForm"> 
    <h3>Faça Login</h3> 
    
    <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
        <div class="error-message" id="error-login-email"></div> </div>
    
    <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <div class="error-message" id="error-login-password"></div> </div>
    
    <button type="submit" class="btn btn-cta">Entrar</button>
    
    <p class="forgot-password"><a href="#">Esqueceu a senha?</a></p>
    <p class="signup-link">Não tem conta? <a href="#" id="showRegister">Cadastre-se</a></p>
    </form>

        <form class="login-form hidden" id="registerForm">
            <h3>Criar Nova Conta</h3>
            <div class="form-group">
                <label for="reg-name">Nome Completo</label>
                <input type="text" id="reg-name" name="name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" name="email" required autocomplete="email"> 
            </div>
            <div class="form-group">
                <label for="reg-password">Senha</label>
                <input type="password" id="reg-password" name="password" required autocomplete="new-password">
            </div>
            <div class="form-group"> 
                <label for="reg-confirm-password">Confirmar Senha</label>
                <input type="password" id="reg-confirm-password" name="confirm_password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-cta">Cadastrar</button>
            <p class="signup-link">Já tem conta? <a href="#" id="showLogin">Faça login</a></p> 
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
